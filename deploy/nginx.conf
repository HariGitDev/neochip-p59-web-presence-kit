# Included inside the http context, so zone declarations belong here.
# Key the limit on the real visitor (Cloudflare header), falling back to the peer address.
# Safe to trust: the origin port is loopback-only, so only cloudflared can reach it.
map $http_cf_connecting_ip $p59_client {
    default $binary_remote_addr;
    "~."    $http_cf_connecting_ip;
}
limit_req_zone $p59_client zone=p59:10m rate=20r/s;

map $http_user_agent $blocked_agent {
    default                 0;
    "~*GPTBot"              1;
    "~*ChatGPT-User"        1;
    "~*OAI-SearchBot"       1;
    "~*CCBot"               1;
    "~*ClaudeBot"           1;
    "~*anthropic-ai"        1;
    "~*Claude-Web"          1;
    "~*Google-Extended"     1;
    "~*Applebot-Extended"   1;
    "~*Bytespider"          1;
    "~*Amazonbot"           1;
    "~*PerplexityBot"       1;
    "~*Diffbot"             1;
    "~*Omgili"              1;
    "~*ImagesiftBot"        1;
    "~*FacebookBot"         1;
    "~*meta-externalagent"  1;
    "~*Scrapy"              1;
    "~*python-requests"     1;
    # Generic bot classes (Hari 2026-11-21: no bots at all, search engines included).
    # Deliberately NOT blocking curl or Python-urllib: our own uptime watcher uses them.
    "~*(bot|crawl|spider|scrap|slurp|headless|phantom|selenium|puppeteer|playwright)" 1;
    "~*(httpclient|okhttp|aiohttp|go-http-client|java/|libwww|scanner|nikto|sqlmap|masscan|zgrab)" 1;
    ""                      1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    if ($blocked_agent) { return 403; }

    limit_req zone=p59 burst=40 nodelay;

    include /etc/nginx/snippets/headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed asset filenames are content-addressed, so they are safe to cache hard.
    location /assets/ {
        include /etc/nginx/snippets/headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /NeoChip-Solutions-Brochure.pdf {
        include /etc/nginx/snippets/headers.conf;
        types { application/pdf pdf; }
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location ~* /\.(git|env) { deny all; return 404; }
}
