# Included inside the http context, so zone declarations belong here.
limit_req_zone $binary_remote_addr zone=p59:10m rate=20r/s;

map $http_user_agent $blocked_agent {
    default                 0;
    "~*GPTBot"              1;
    "~*ChatGPT-User"        1;
    "~*OAI-SearchBot"       1;
    "~*CCBot"               1;
    "~*ClaudeBot"           1;
    "~*anthropic-ai"        1;
    "~*Claude-Web"          1;
    "~*Google-Extended"     1;
    "~*Applebot-Extended"   1;
    "~*Bytespider"          1;
    "~*Amazonbot"           1;
    "~*PerplexityBot"       1;
    "~*Diffbot"             1;
    "~*Omgili"              1;
    "~*ImagesiftBot"        1;
    "~*FacebookBot"         1;
    "~*meta-externalagent"  1;
    "~*Scrapy"              1;
    "~*python-requests"     1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    if ($blocked_agent) { return 403; }

    limit_req zone=p59 burst=40 nodelay;

    include /etc/nginx/snippets/headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed asset filenames are content-addressed, so they are safe to cache hard.
    location /assets/ {
        include /etc/nginx/snippets/headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location ~* /\.(git|env) { deny all; return 404; }
}
