# Included inside the http context, so zone declarations belong here.
limit_req_zone $binary_remote_addr zone=p59:10m rate=20r/s;

map $http_user_agent $blocked_agent {
    default                 0;
    "~*GPTBot"              1;
    "~*ChatGPT-User"        1;
    "~*CCBot"               1;
    "~*ClaudeBot"           1;
    "~*anthropic-ai"        1;
    "~*Google-Extended"     1;
    "~*Applebot-Extended"   1;
    "~*Bytespider"          1;
    "~*Amazonbot"           1;
    "~*PerplexityBot"       1;
    "~*Diffbot"             1;
    "~*Omgili"              1;
    "~*ImagesiftBot"        1;
    "~*FacebookBot"         1;
    "~*meta-externalagent"  1;
    "~*Scrapy"              1;
    "~*python-requests"     1;
}

server {
    listen 80;

    if ($blocked_agent) { return 403; }

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # --- Security / anti-scraping headers (platform rule 14) ---
    add_header X-Content-Type-Options    "nosniff"                      always;
    add_header X-Frame-Options           "DENY"                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                 always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # TEST SITE: never index, never train. Flip to "noai, noimageai" only
    # (dropping noindex/nofollow) when this config serves the real public site.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, noai, noimageai" always;

    # --- Throttling ---
    limit_req zone=p59 burst=40 nodelay;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        access_log off;
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, noai, noimageai" always;
    }

    # Hashed assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, noai, noimageai" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, noai, noimageai" always;
        try_files $uri $uri/ /index.html;
    }

    location ~* /\.(git|env) { deny all; return 404; }
}
