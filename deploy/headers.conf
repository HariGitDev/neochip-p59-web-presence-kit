# Shared response headers.
#
# NGINX GOTCHA: add_header directives are NOT inherited into a location block that
# declares any add_header of its own — the child set replaces the parent set entirely.
# So this file must be `include`d in the server block AND in every location block that
# adds a header. Do not "tidy" it into the server block alone; the headers silently
# vanish from every location. Caught 2026-08-23 on the first Ashburn deploy, where only
# X-Robots-Tag survived because `location /` redeclared it.

add_header X-Content-Type-Options     "nosniff"                         always;
add_header X-Frame-Options            "DENY"                            always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin"                     always;
add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# TEST SITE: never index, never train. When this config serves the real public site,
# drop noindex/nofollow/noarchive here but keep noai/noimageai.
add_header X-Robots-Tag "noindex, nofollow, noarchive, noai, noimageai" always;
