# P59 Web Presence Kit — Ashburn (OCI Virginia) PRODUCTION: neochipsolutions.com + www.
#
# Public build (SITE_ENV=prod): placeholders and unverified figures are compiled out and the
# image build fails if any survive. New service on its own loopback port; displaces nothing.
# The gated test copy (p59-testweb, :8059) keeps running alongside it.
#
#   docker compose -f docker-compose.ashburn-prod.yml up -d --build
#
name: p59-web

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_ENV: prod
    image: p59-web:latest
    container_name: p59-web
    restart: unless-stopped
    # Ashburn's docker address pools are exhausted (cannot create a per-project network),
    # so this single static container uses the default bridge. No sibling services here.
    network_mode: bridge
    environment:
      TZ: America/New_York
    ports:
      - "127.0.0.1:8056:80"
    labels:
      com.neochip.project: "P59"
      com.neochip.env: "prod"
      com.neochip.hostname: "neochipsolutions.com"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

  # Contact-form backend. Published only on loopback; cloudflared routes /api/* to it.
  # Secrets (SALT, NTFY_URL) live in /opt/neochip-secrets/p59/api.env on the host, never in git.
  api:
    build:
      context: ./api
    image: p59-api:latest
    container_name: p59-api
    restart: unless-stopped
    network_mode: bridge
    env_file:
      - /opt/neochip-secrets/p59/api.env
    environment:
      TZ: America/New_York
      ALLOWED_ORIGINS: "https://neochipsolutions.com,https://www.neochipsolutions.com"
    ports:
      - "127.0.0.1:8060:8060"
    volumes:
      - p59_contact_data:/data
    labels:
      com.neochip.project: "P59"
      com.neochip.env: "prod"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"

volumes:
  p59_contact_data:
